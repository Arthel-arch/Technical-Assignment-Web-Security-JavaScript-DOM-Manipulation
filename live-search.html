<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Product Search</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #17324d;
      background: #eef4f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fbfa, #dbe9e8);
    }

    main {
      width: min(760px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 4rem 0;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: #bd5b38;
      font: 700 0.8rem/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.8rem);
      line-height: 0.95;
    }

    .intro {
      max-width: 38rem;
      margin: 1rem 0 2rem;
      color: #486174;
      font: 1.1rem/1.6 Arial, sans-serif;
    }

    .search-panel {
      padding: 1.25rem;
      border: 1px solid #b9ced0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 1rem 2rem rgba(23, 50, 77, 0.08);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font: 700 0.9rem/1.2 Arial, sans-serif;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid #8eabad;
      border-radius: 6px;
      color: #17324d;
      background: #fff;
      font: 1rem/1.4 Arial, sans-serif;
    }

    input:focus {
      border-color: #bd5b38;
      outline: 3px solid rgba(189, 91, 56, 0.2);
    }

    #result-count {
      margin: 1.25rem 0 0.75rem;
      color: #486174;
      font: 700 0.85rem/1.2 Arial, sans-serif;
    }

    #results {
      display: grid;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .result-item {
      padding: 1rem;
      border-left: 4px solid #bd5b38;
      background: #fff;
    }

    .result-name {
      display: block;
      color: #17324d;
      font: 700 1.15rem/1.3 Georgia, "Times New Roman", serif;
    }

    .result-category {
      display: block;
      margin-top: 0.25rem;
      color: #486174;
      font: 0.9rem/1.3 Arial, sans-serif;
    }

    .empty-state {
      padding: 1rem;
      border: 1px dashed #8eabad;
      color: #486174;
      font: 1rem/1.4 Arial, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">DOM search demo</p>
    <h1>Find a product</h1>
    <p class="intro">Type into the search field to filter the catalogue as you go.</p>

    <section class="search-panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Live search</h2>
      <label for="search-input">Search by product or category</label>
      <input id="search-input" type="search" autocomplete="off" placeholder="Try “tea” or “home”">
      <p id="result-count" aria-live="polite"></p>
      <ul id="results" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    const products = [
      { name: "Cedar Desk Lamp", category: "Home" },
      { name: "Ginger Citrus Tea", category: "Grocery" },
      { name: "Linen Market Tote", category: "Accessories" },
      { name: "North Coast Notebook", category: "Stationery" },
      { name: "Olive Wood Spoon", category: "Home" },
      { name: "Rainy Day Coffee", category: "Grocery" }
    ];

    const searchInput = document.querySelector("#search-input");
    const resultCount = document.querySelector("#result-count");
    const results = document.querySelector("#results");

    function renderProducts(items) {
      results.replaceChildren();
      resultCount.textContent = `${items.length} ${items.length === 1 ? "result" : "results"}`;

      if (items.length === 0) {
        const emptyState = document.createElement("li");
        emptyState.className = "empty-state";
        emptyState.textContent = "No products match that search.";
        results.append(emptyState);
        return;
      }

      items.forEach((product) => {
        const item = document.createElement("li");
        item.className = "result-item";

        const name = document.createElement("span");
        name.className = "result-name";
        name.textContent = product.name;

        const category = document.createElement("span");
        category.className = "result-category";
        category.textContent = product.category;

        item.append(name, category);
        results.append(item);
      });
    }

    searchInput.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      const filteredProducts = products.filter((product) => {
        const searchableText = `${product.name} ${product.category}`.toLowerCase();
        return searchableText.includes(query);
      });

      renderProducts(filteredProducts);
    });

    renderProducts(products);
  </script>
</body>
</html>
